<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart Expenses AI — Forgot Password</title>
<style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #F4F1ED;
    height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #4E5E6C;
  }
  .card {
    background: #FFFFFF;
    padding: 45px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    width: 400px;
    border: 1px solid #E8E5E2;
  }
  h1 {
    color: #4E5E6C;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 5px;
    margin-top: 0;
  }
  p {
    color: #748492;
    font-size: 16px;
    margin-bottom: 30px;
    margin-top: 10px;
  }
  input[type="email"] {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #D0D0D0;
    border-radius: 12px;
    background: #FAFAFA;
    color: #4E5E6C;
    outline: none;
    box-sizing: border-box;
    transition: 0.2s;
  }
  input:focus {
    border-color: #9EC3B5;
    box-shadow: 0 0 0 3px rgba(158,195,181,0.3);
    background: #FFFFFF;
  }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin: 15px 0 8px 0;
    color: #FFFFFF;
    background: #6CA08D;
    transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
  }
  button:hover {
    transform: translateY(-1px);
    background: #5F8E7D;
    box-shadow: 0 4px 14px rgba(108, 160, 141, 0.4);
  }
  button:disabled {
    background: #B9C3C9;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }
  .switch {
    margin-top: 20px;
    color: #748492;
    cursor: pointer;
    font-size: 14px;
    transition: 0.2s;
  }
  .switch:hover {
    color: #4E5E6C;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Forgot Password</h1>
    <p>Enter your email address to receive a password reset link.</p>

    <form id="forgotForm">
      <input type="email" id="email" placeholder="Enter your email" required />
      <button type="submit" id="sendBtn">Send Reset Link</button>
    </form>

    <div class="switch" onclick="window.location.href='login.html'">Back to Login</div>
  </div>

  <script>
    document.getElementById('forgotForm').addEventListener('submit', async function(event) {
      event.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const btn = document.getElementById('sendBtn');
      
      if (!email) return;

      // disable button to prevent spam
      btn.disabled = true;
      btn.textContent = "Sending...";

      try {
        const response = await fetch('/api/forgot_password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (data.success) {
          alert('If this email is registered, a reset link has been sent. Check your inbox.\n\nNote: For first-time password resets, the email may take up to 5 minutes to arrive.');
        } else {
          alert('Error: ' + (data.message || 'Failed to send reset link.'));
          btn.disabled = false;
          btn.textContent = "Send Reset Link";
        }

      } catch (error) {
        console.error(error);
        alert('An issue occurred. Please try again later.');
        btn.disabled = false;
        btn.textContent = "Send Reset Link";
      }
    });
  </script>
</body>
</html>
