<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"
/>
<meta name="viewport"
content="width=device-width, initial-scale=1.0" />
<title>Smart
Expenses AI — Login</title>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/*
------------------------------------- */
/* Clean CSS -
Verified for standard spacing */
/*
------------------------------------- */
 
body {
    font-family:
'Segoe UI', Arial, sans-serif;
    background:
#F4F1ED;
    height:
100vh;
    margin:
0;
    display:
flex;
    justify-content:
center;
    align-items:
center;
    color:
#4E5E6C;
}
 
.card {
    background:
#FFFFFF;
    padding:
45px;
    border-radius:
18px;
    text-align:
center;
    box-shadow:
0 8px 25px rgba(0, 0, 0, 0.1);
    animation:
fadeIn 1.2s ease-in-out;
    width:
400px;
    border:
1px solid #E8E5E2;
}
 
h1 {
    color:
#4E5E6C;
    font-size:
26px;
    font-weight:
700;
    letter-spacing:
0.5px;
    margin-bottom:
5px;
    margin-top:
0;
}
 
p {
    color:
#748492;
    font-size:
16px;
    margin-bottom:
30px;
    margin-top:
10px;
}
 
input[type="text"],
input[type="email"],
input[type="password"]
{
    width:
100%;
    padding:
12px 40px 12px 12px;
    margin:
10px 0;
    border:
1px solid #D0D0D0;
    border-radius:
12px;
    background:
#FAFAFA;
    color:
#4E5E6C;
    outline:
none;
    box-sizing:
border-box;
    transition:
0.2s;
}
 
input:focus {
    border-color:
#9EC3B5;
    box-shadow:
0 0 0 3px rgba(158, 195, 181, 0.3);
    background:
#FFFFFF;
}
 
.password-container
{
    position:
relative;
}
 
.toggle-eye {
    position:
absolute;
    right:
12px;
    top:
50%;
    transform:
translateY(-50%);
    cursor:
pointer;
    user-select:
none;
    font-size:
18px;
    color:
#9EC3B5;
}
 
.auth-options {
    display:
flex;
    justify-content:
space-between;
    align-items:
center;
    margin:
12px 0;
    font-size:
14px;
    color:
#748492;
}
 
.remember {
    display:
flex;
    align-items:
center;
    gap:
8px;
}
 
.forgot-link {
    color:
#748492;
    text-decoration:
none;
    transition:
color 0.2s;
}
 
.forgot-link:hover
{
    color:
#4E5E6C;
    text-decoration:
underline;
}
 
button {
width: 100%;
padding: 14px;
border: none;
border-radius: 12px;
font-size: 16px;
font-weight: bold;
cursor: pointer;
margin: 15px 0 8px 0;
color: #FFFFFF;
background: #6CA08D; 
transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
}
 
button:hover {
transform: translateY(-1px);
background: #5F8E7D; 
box-shadow: 0 4px 14px rgba(108, 160, 141, 0.4); /* Used a darker shadow to match */
}

button:disabled {
background: #B9C3C9;
cursor: not-allowed;
transform: none;
box-shadow: none;
}
 
.switch {
    margin-top:
20px;
    color:
#748492;
    cursor:
pointer;
    font-size:
14px;
    transition:
0.2s;
}
 
.switch:hover {
    color:
#4E5E6C;
}
 
@keyframes fadeIn
{
    
from {
    
    opacity: 0;
    
    transform: translateY(-10px);
    }
    
to {
    
    opacity: 1;
    
    transform: translateY(0);
    }
}
</style>
</head>
<body>
    <div
class="card">
    
        <div id="loginForm">
    
            <h1>Welcome Back</h1>
    
            <p>Login to continue managing your smart
finances</p>
    
            <input type="email" id="loginEmail"
placeholder="Enter your email" required />
    
            
    
            <div class="password-container">
    
                <input type="password" id="loginPassword"
placeholder="Enter your password" required />
    
                <span class="toggle-eye"
id="toggleLoginPassword"><i class="fas fa-eye-slash"></i></span>
    
            </div>
    
            
    
            <div class="auth-options">
    
                <div class="remember">
    
                    <input type="checkbox"
id="rememberMe" />
    
                    <label for="rememberMe">Remember
me</label>
    
                </div>
    
                <a href="forgot_password.html"
class="forgot-link">Forgot Password?</a>
    
            </div>
 
    
            <button id="loginBtn">Login</button>
    
            <div class="switch" onclick="window.location.href='register.html'">Don’t
have an account? Register</div>
    
        </div>
    </div>
 
<script>
// Base URL for your deployed API on App Engine
const API_BASE_URL = "https://gentle-dominion-474410-t3.as.r.appspot.com";

// Icon classes for Font Awesome
const ICON_HIDDEN_CLASS = "fas fa-eye-slash"; 
const ICON_VISIBLE_CLASS = "fas fa-eye"; 
 
// Function to handle the password show/hide toggle
function setupToggle(inputId, toggleId) {
    const input = document.getElementById(inputId);
    const toggle = document.getElementById(toggleId);
    // Get the <i> element inside the span
    const toggleIcon = toggle.querySelector('i'); 
 
    // Set initial state
    toggleIcon.className = ICON_HIDDEN_CLASS;
 
    toggle.addEventListener("click", () => {
        const type = input.type === "password" ? "text" : "password";
        input.type = type;
        // Toggle the icon class based on the new input type
        toggleIcon.className = type === "password" ? ICON_HIDDEN_CLASS : ICON_VISIBLE_CLASS;
    });
}

// Initialize the password toggle
setupToggle("loginPassword", "toggleLoginPassword");

// Get the login button for event listening and disabling
const loginBtn = document.getElementById("loginBtn");
 
loginBtn.addEventListener("click", async () => {
    const email = document.getElementById("loginEmail").value.trim();
    const pass = document.getElementById("loginPassword").value;
    const remember = document.getElementById("rememberMe").checked;
 
    if (!email || !pass) return showToast("Please fill out all fields.", "error");

    loginBtn.disabled = true; // Disable button to prevent double-click

    try {
        const res = await fetch(`${API_BASE_URL}/api/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, pass })
        });
 
        const data = await res.json();
 
        if (res.ok && data.success) { // Check for a successful HTTP status and API success message
            
            // --- 🔑 CRITICAL FIX: Ensure your API returns userId and userName ---
            const { token, userId, userName } = data;
            
            // Clear any old session/local storage data first (Good practice)
            sessionStorage.clear();
            localStorage.removeItem("se_remember");
            localStorage.removeItem("se_token");
            localStorage.removeItem("se_userId");
            
            // Use sessionStorage for current user data (session-based)
            sessionStorage.setItem("se_current", email); // Storing email
            sessionStorage.setItem("se_token", token);
            sessionStorage.setItem("se_userId", userId);// 🟢 ADDED: REQUIRED BY NEW DASHBOARD
            sessionStorage.setItem("se_userName", userName); // 🟢 ADDED: For personalization

            // If 'Remember me' is checked, also store a flag/token in localStorage
            if (remember) {
                // Store the email and ID to re-authenticate quickly later
                localStorage.setItem("se_remember", email); 
                localStorage.setItem("se_token", token);
                localStorage.setItem("se_userId", userId);// 🟢 ADDED: REQUIRED BY NEW DASHBOARD
            }
 
            showToast("Login successful! Redirecting to dashboard...", "success");
            
            // The 1000ms delay is good practice to ensure data is committed before redirect
            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 1000);

        } else {
            // Handle specific errors from the backend (e.g., "Invalid credentials")
                showToast(data.message || "Login failed. Check email and password.", "error");
        }
    }
    catch (err) {
        // Display a network error if the fetch fails
        showToast("Network error: Could not connect to the server.", "error");
        console.error("Login Error:", err);
    } finally {
        loginBtn.disabled = false; // Re-enable button
    }
});

// 🌿 Create toast container once (Toast functions follow)
const toastContainer = document.createElement('div');
toastContainer.id = 'toastContainer';
toastContainer.style.position = 'fixed';
toastContainer.style.bottom = '20px';
toastContainer.style.right = '20px';
toastContainer.style.zIndex = '9999';
document.body.appendChild(toastContainer);

// 🌿 Function to show toast
function showToast(message, type = 'success') {
    const toast = document.createElement('div');
    toast.textContent = message;
    toast.style.padding = '14px 20px';
    toast.style.marginTop = '10px';
    toast.style.borderRadius = '8px';
    toast.style.fontSize = '16px';
    toast.style.color = '#fff';
    toast.style.boxShadow = '0 4px 10px rgba(0,0,0,0.2)';
    toast.style.transition = 'all 0.5s ease';
    toast.style.opacity = '0';

    if (type === 'success') toast.style.background = '#6CA08D';  // green
    if (type === 'error') toast.style.background = '#E74C3C';    // red
    if (type === 'info') toast.style.background = '#3498DB';     // blue

    toastContainer.appendChild(toast);
    setTimeout(() => toast.style.opacity = '1', 50); // fade in
    setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 500); // remove after fade out
    }, 3000);
}

</script>
</body>
</html>
